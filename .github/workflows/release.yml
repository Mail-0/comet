name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build (publishing a tag requires macos linux).
        type: string
        default: macos linux

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: version
        name: Validate workspace version and tag
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME is not v$version" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  zgx:
    needs: version
    uses: ./.github/workflows/zgx-build.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      platforms: ${{ github.event_name == 'push' && 'macos linux' || inputs.platforms }}
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, zgx]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: keiki-*
          path: release-assets
          merge-multiple: true
      - name: Validate packages and generate checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 scripts/release-manifest.py "$VERSION" release-assets
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release-assets/*
          generate_release_notes: true
          make_latest: 'true'
          overwrite_files: false
