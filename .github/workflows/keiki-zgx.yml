name: Keiki ZGX preview

on:
  pull_request:
    paths:
      - 'apps/keiki-zgx/**'
      - 'apps/zeron/**'
      - 'crates/keiki-api/**'
      - 'crates/keiki-model/**'
      - 'crates/copilot/**'
      - 'crates/engine/**'
      - 'crates/proto/**'
      - 'crates/rpc/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/keiki-zgx.yml'

permissions:
  contents: read

jobs:
  preview:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libdbus-1-dev libfontconfig1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev libx11-xcb-dev \
            libfreetype-dev libasound2-dev libvulkan-dev pkg-config cmake xvfb mesa-vulkan-drivers
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/keiki-zgx -> target
            . -> target
      - run: cargo fmt --manifest-path apps/keiki-zgx/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path apps/keiki-zgx/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path apps/keiki-zgx/Cargo.toml
      - run: cargo build --locked --manifest-path apps/keiki-zgx/Cargo.toml
      - name: Launch the preview against a real headless workspace
        if: runner.os == 'Linux'
        run: |
          cargo build --locked -p zeron
          data="$(mktemp -d)"
          port=27881
          ZERON_DATA_DIR="$data" ZERON_IPC_PORT="$port" target/debug/zeron headless >"$data/engine.log" 2>&1 &
          engine=$!
          trap 'kill "$engine" 2>/dev/null || true; rm -rf "$data"' EXIT
          for _ in $(seq 1 50); do
            if curl --silent --max-time 1 -o /dev/null "http://127.0.0.1:$port"; then
              break
            fi
            if ! kill -0 "$engine" 2>/dev/null; then
              cat "$data/engine.log"
              exit 1
            fi
            sleep 0.2
          done
          KEIKI_PREVIEW_IPC_PORT="$port" xvfb-run -a timeout 30s apps/keiki-zgx/target/debug/keiki-zgx --smoke
