name: CI
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  core:
    uses: ./.github/workflows/ui-tests.yml
  desktop-entry:
    uses: ./.github/workflows/linux-installer.yml
  macos:
    uses: ./.github/workflows/macos.yml
  windows:
    uses: ./.github/workflows/windows.yml
  zgx:
    uses: ./.github/workflows/zgx-tests.yml
  shipping-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Release contract tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_release_manifest.py' -v
  result:
    name: CI result
    if: always()
    needs: [core, desktop-entry, macos, windows, zgx, shipping-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Require all suites
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"
