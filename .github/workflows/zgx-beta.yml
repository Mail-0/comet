name: Keiki beta
on:
  push:
    tags: ['beta-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Workspace version followed by -beta.<number>.
        type: string
        required: true
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: version
        env:
          TAG: ${{ github.ref_name }}
          BETA_VERSION: ${{ inputs.version }}
        run: |
          version="${BETA_VERSION:-${TAG#beta-v}}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    uses: ./.github/workflows/zgx-build.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      platforms: macos linux
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: keiki-*
          path: release-assets
          merge-multiple: true
      - env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 scripts/release-manifest.py "$VERSION" release-assets
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: beta-v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          prerelease: true
          make_latest: 'false'
          generate_release_notes: true
          overwrite_files: false
