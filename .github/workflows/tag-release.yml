name: Tag Keiki release
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: tag-release
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Tag a new workspace version and dispatch its build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; no new release"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          # Tags pushed by GITHUB_TOKEN do not trigger push workflows.
          gh workflow run release.yml --ref "$tag" -f platforms='macos linux'
