[workspace]
resolver = "2"
members = [
    "crates/theme",
    "crates/model",
    "crates/api",
    "crates/ui",
    "crates/syntax",
    "apps/keiki",
]

[workspace.package]
version = "0.2.29"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
keiki-model = { path = "crates/model" }
keiki-api = { path = "crates/api" }
keiki-ui = { path = "crates/ui" }
keiki-syntax = { path = "crates/syntax" }
keiki-theme = { path = "crates/theme" }

# GPUI fork inherited from comet.
gpui = { git = "https://github.com/wingleeio/zed", rev = "e2ddcc6805f8c5088e62a60dfe517abcccd61a9a" }
gpui_platform = { git = "https://github.com/wingleeio/zed", rev = "e2ddcc6805f8c5088e62a60dfe517abcccd61a9a", features = [
    "wayland",
    "x11",
    "font-kit",
    "runtime_shaders",
] }
gpui_tokio = { git = "https://github.com/wingleeio/zed", rev = "e2ddcc6805f8c5088e62a60dfe517abcccd61a9a" }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
plist = "1"
base64 = "0.22"
rand = "0.9"
url = "2"

mimalloc = "0.1"
anyhow = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
fontdb = "0.23"
ttf-parser = "0.25.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[profile.release]
lto = "thin"
strip = "symbols"

[profile.dev]
# gpui is slow unoptimized; match zed's approach for deps
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
